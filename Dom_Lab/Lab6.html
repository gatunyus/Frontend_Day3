<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6: Toggle Class</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 20px; line-height: 1.5; font-family: sans-serif; background-color: #f4f6f9; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .alert-mode {
            background-color: #dc3545 !important;
            color: white !important;
            border: 5px solid #ffc107 !important;
            transition: 0.3s;
        }
        .alert-mode .card-body { color: white !important; }
        
        /*ำให้ปุ่ม toggle เป็นสีขาวเมื่ออยู่ใน Alert Mode */
        .alert-mode .btn-outline-danger {
            color: white !important;
            border-color: white !important;
        }
        /* เมื่อ hover ใน Alert Mode ให้พื้นหลังปุ่มเป็นสีขาวและตัวหนังสือสีแดง */
        .alert-mode .btn-outline-danger:hover {
            background-color: white !important;
            color: #dc3545 !important;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">🖥️ Lab 6: JavaScript DOM Manipulation</h1>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card" id="factory-dashboard">
                <div class="card-header">
                    6. สลับหน้าตา (Toggle Class)
                </div>
                <div class="card-body text-center">
                    <h4>หน้าต่างนี้สามารถเปลี่ยนโหมดได้</h4>
                    <p>ใช้ ClassList เพื่อเปลี่ยน CSS ทั้งชุด</p>
                    <button class="btn btn-outline-danger btn-lg mt-2" onclick="toggleAlert()">🚨 สลับโหมดเตือนภัย (Toggle)</button>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const dashboard = document.getElementById("factory-dashboard");
    function toggleAlert() {
        dashboard.classList.toggle("alert-mode");
    }
</script>
</body>
</html>
