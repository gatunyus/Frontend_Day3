<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5: Disable/Enable Attribute</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 20px; line-height: 1.5; font-family: sans-serif; background-color: #f4f6f9; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">🖥️ Lab 5: JavaScript DOM Manipulation</h1>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-secondary text-white">
                    5. ล็อกการกดปุ่ม (Disable Button)
                </div>
                <div class="card-body text-center">
                    <div class="d-flex gap-2">
                        <button id="start-btn" class="btn btn-success btn-lg w-50" onclick="startProcess()">▶️ เริ่มสายพาน</button>
                        <button id="stop-btn" class="btn btn-danger btn-lg w-50" onclick="stopProcess()" disabled>🛑 หยุดการทำงาน</button>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const btnStart = document.getElementById("start-btn");
    const btnStop = document.getElementById("stop-btn");
    function startProcess() {
        btnStart.disabled = true;
        btnStart.innerText = "⏳ กำลังทำงาน...";
        btnStop.disabled = false;
    }
    function stopProcess() {
        btnStart.disabled = false;
        btnStart.innerText = "▶️ เริ่มสายพาน";
        btnStop.disabled = true;
    }
</script>
</body>
</html>
