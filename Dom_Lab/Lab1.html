<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1: Change Text</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 20px; line-height: 1.5; font-family: sans-serif; background-color: #f4f6f9; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">🖥️ Lab 1: JavaScript DOM Manipulation</h1>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    1. เปลี่ยนข้อความ (Change Text)
                </div>
                <div class="card-body text-center">
                    <h3>ยอดการผลิตปัจจุบัน</h3>
                    <h1 id="production-count" class="display-1 text-primary fw-bold">0</h1>
                    <button class="btn btn-outline-primary btn-lg w-100" onclick="updateCounter()">+ จำลองเซ็นเซอร์นับชิ้นงาน</button>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const countDisplay = document.getElementById("production-count");
    let currentCount = 0;
    function updateCounter() {
        currentCount++; 
        countDisplay.innerText = currentCount; 
    }
</script>
</body>
</html>
