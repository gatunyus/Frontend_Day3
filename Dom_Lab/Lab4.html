<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4: Create & Append</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 20px; line-height: 1.5; font-family: sans-serif; background-color: #f4f6f9; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">🖥️ Lab 4: JavaScript DOM Manipulation</h1>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-info text-dark">
                    4. เพิ่มข้อมูลใหม่ (Append Element)
                </div>
                <div class="card-body">
                    <button class="btn btn-info btn-lg w-100 mb-3" onclick="addErrorLog()">เพิ่ม Log การแจ้งเตือน</button>
                    <ul id="log-list" class="list-group">
                    </ul>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const logList = document.getElementById("log-list");
    let logCount = 1;

    function addErrorLog() {
        const newListItem = document.createElement("li");
        // ใช้ class เดียวกับ Lab4_Ans เพื่อให้มี badge และจัดตำแหน่งสวยงาม
        newListItem.className = "list-group-item list-group-item-danger d-flex justify-content-between align-items-center"; 
        
        const now = new Date();
        const timeStr = now.toLocaleTimeString(); 
        
        // ใช้ innerHTML เพื่อใส่โครงสร้าง HTML เข้าไปในลิสต์
        newListItem.innerHTML = `
            <span><strong>#${logCount}</strong> [${timeStr}] ตรวจพบความผิดปกติ</span>
            <span class="badge bg-danger rounded-pill">Error</span>
        `;
        
        logList.appendChild(newListItem);
        logCount++;
    }
</script>
</body>
</html>
