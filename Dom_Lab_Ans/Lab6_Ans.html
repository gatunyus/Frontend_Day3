<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6: Toggle Class (Answer)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 20px; line-height: 1.5; font-family: sans-serif; background-color: #f4f6f9; transition: background-color 0.3s; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: 0.3s; }
        
        /* เฉลย: Dark Mode Class */
        .dark-mode-active {
            background-color: #121212 !important;
            color: white !important;
        }
        .dark-mode-active .card {
            background-color: #1e1e1e;
            color: white;
            border: 1px solid #333;
        }
        .dark-mode-active .card-header {
            background-color: #333 !important;
            color: white !important;
        }

        .alert-mode {
            background-color: #dc3545 !important;
            color: white !important;
            border: 5px solid #ffc107 !important;
            transition: 0.3s;
        }

        .alert-mode .btn-outline-danger {
            color: white !important;
            border-color: white !important;
        }
        .alert-mode .btn-outline-danger:hover {
            background-color: white !important;
            color: #dc3545 !important;
        }
    </style>
</head>
<body>
<div class="container py-4" id="main-container">
    <h1 class="text-center mb-4">🖥️ Lab 6: Toggle Class (Answer)</h1>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card" id="factory-dashboard">
                <div class="card-header bg-primary text-white">
                    6. สลับหน้าตา (Toggle Class)
                </div>
                <div class="card-body text-center">
                    <h4>ควบคุมโหมดการแสดงผล</h4>
                    <p>สลับระหว่างโหมดการใช้งานต่างๆ</p>
                    <div class="d-flex flex-column gap-2">
                        <button class="btn btn-outline-danger btn-lg" onclick="toggleAlert()">🚨 สลับโหมดเตือนภัย (Alert Mode)</button>
                        <!-- เฉลย: ปุ่ม Dark Mode -->
                        <button class="btn btn-dark btn-lg" onclick="toggleDarkMode()">🌙 สลับ Dark Mode / Light Mode</button>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const dashboard = document.getElementById("factory-dashboard");
    const body = document.body;

    function toggleAlert() {
        dashboard.classList.toggle("alert-mode");
    }

    // เฉลย: สลับ Dark Mode
    function toggleDarkMode() {
        body.classList.toggle("dark-mode-active");
    }
</script>
</body>
</html>
