<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3: Hide/Show (Answer)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 20px; line-height: 1.5; font-family: sans-serif; background-color: #f4f6f9; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">🖥️ Lab 3: Hide/Show (Answer)</h1>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    3. ซ่อน/แสดงองค์ประกอบ (Hide/Show)
                </div>
                <div class="card-body text-center">
                    <!-- เฉลย: ใช้ปุ่มเดียวสำหรับ Toggle -->
                    <button id="toggle-btn" class="btn btn-warning btn-lg w-100 mb-3" onclick="togglePanel()">⚠️ แสดงแผงควบคุมฉุกเฉิน</button>
                    
                    <div id="emergency-panel" class="alert alert-danger" style="display: none;">
                        <h4 class="fw-bold">🚨 แผงควบคุมฉุกเฉิน</h4>
                        <p>ใช้งานเฉพาะกรณีเกิดอุบัติเหตุเท่านั้น!</p>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const emergencyPanel = document.getElementById("emergency-panel");
    const toggleBtn = document.getElementById("toggle-btn");

    // เฉลย: ฟังก์ชัน Toggle ปุ่มเดียวทำสองอย่าง
    function togglePanel() {
        if (emergencyPanel.style.display === "none") {
            emergencyPanel.style.display = "block";
            toggleBtn.innerText = "❌ ปิดแผงควบคุม";
            toggleBtn.className = "btn btn-danger btn-lg w-100 mb-3";
        } else {
            emergencyPanel.style.display = "none";
            toggleBtn.innerText = "⚠️ แสดงแผงควบคุมฉุกเฉิน";
            toggleBtn.className = "btn btn-warning btn-lg w-100 mb-3";
        }
    }
</script>
</body>
</html>
