<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7: Read Input Value (Answer)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 20px; line-height: 1.5; font-family: sans-serif; background-color: #f4f6f9; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">🖥️ Lab 7: Read Input Value (Answer)</h1>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-dark text-white">
                    7. ดึงค่าจากช่องพิมพ์ (Read Input Value)
                </div>
                <div class="card-body">
                    <!-- ส่วนตั้งค่าขนาดบรรจุภัณฑ์ -->
                    <div class="row mb-3 bg-light p-3 rounded border">
                        <div class="col-md-6">
                            <label class="form-label text-secondary">แพ็ค / 1 พาเลต:</label>
                            <!-- แก้ไข: เพิ่ม oninput เพื่อให้คำนวณทันทีที่เปลี่ยนค่าพาเลต -->
                            <input type="number" id="pallet-input" class="form-control" value="50" min="1" oninput="updateSpeed()">
                        </div>
                        <div class="col-md-6 mb-2 mb-md-0">
                            <label class="form-label text-secondary">ขวด / 1 แพ็ค:</label>
                            <!-- แก้ไข: เพิ่ม oninput เพื่อให้คำนวณทันทีที่เปลี่ยนค่าขวดต่อแพ็ค -->
                            <input type="number" id="dozen-input" class="form-control" value="12" min="1" oninput="updateSpeed()">
                        </div>
                    </div>

                    <hr>

                    <!-- ส่วนตั้งค่าความเร็ว -->
                    <label class="form-label mt-2">จำนวนผลิต / หน่วย :</label>
                    <div class="input-group mb-3">
                        <input type="number" id="speed-input" class="form-control form-control-lg" value="1000">
                        <!-- แก้ไข: เพิ่ม select id="speed-unit" เพื่อเลือกหน่วย -->
                        <select id="speed-unit" class="form-select" style="max-width: 150px;">
                            <option value="bottle">ขวด</option>
                            <option value="pack">แพ็ค</option>
                            <option value="pallet">พาเลต</option>
                        </select>
                        <button class="btn btn-primary btn-lg" onclick="updateSpeed()">คำนวณ</button>
                    </div>
                    <div id="current-speed-display" class="alert alert-info fs-4 mb-0">
                        ... กำลังรอการคำนวณ 
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const inputField = document.getElementById("speed-input");
    const inputUnit = document.getElementById("speed-unit");
    const inputDozen = document.getElementById("dozen-input");
    const inputPallet = document.getElementById("pallet-input");
    const displaySpeed = document.getElementById("current-speed-display");

    // แก้ไข: ใช้ addEventListener เพื่อดักจับการพิมพ์ (input) และการเลือกหน่วย (change)
    inputField.addEventListener("input", updateSpeed);
    inputUnit.addEventListener("change", updateSpeed);

    // หมายเหตุ: ส่วน pallet-input และ dozen-input ถูกสั่งงานผ่าน oninput ใน HTML แล้ว

    function updateSpeed() {
        let val = inputField.value;
        let unit = inputUnit.value;
        let bottlesPerDozen = parseInt(inputDozen.value);
        let dozensPerPallet = parseInt(inputPallet.value);

        // ตรวจสอบค่าเบื้องต้น
        if (val === "" || isNaN(val) || val < 0) {
            displaySpeed.innerText = "❌ กรุณาระบุตัวเลขที่ถูกต้อง";
            displaySpeed.className = "alert alert-danger fs-4 mb-0";
            return; 
        }

        if (isNaN(bottlesPerDozen) || bottlesPerDozen <= 0 || isNaN(dozensPerPallet) || dozensPerPallet <= 0) {
            displaySpeed.innerText = "❌ จำนวนขวดหรือพาเลตต้องมากกว่า 0";
            displaySpeed.className = "alert alert-warning fs-4 mb-0";
            return;
        }

        // คำนวณขวดทั้งหมดตามหน่วยที่เลือก
        let totalBottles = 0;
        if (unit === "bottle") {
            totalBottles = parseFloat(val);
        } else if (unit === "pack") {
            totalBottles = parseFloat(val) * bottlesPerDozen;
        } else if (unit === "pallet") {
            totalBottles = parseFloat(val) * (bottlesPerDozen * dozensPerPallet);
        }

        // คำนวณ พาเลต, โหล, และขวดที่เหลือ
        let bottlesPerPallet = bottlesPerDozen * dozensPerPallet; 
        let pallets = Math.floor(totalBottles / bottlesPerPallet);
        let remainderAfterPallets = totalBottles % bottlesPerPallet; 

        let dozens = Math.floor(remainderAfterPallets / bottlesPerDozen);
        let bottles = Math.round(remainderAfterPallets % bottlesPerDozen); 

        // แสดงผลลัพธ์
        displaySpeed.innerHTML = `
            <div class="fs-5 text-primary">
                <strong>ผลการคำนวณ :</strong> ${pallets} พาเลต, ${dozens} แพ็ค, ${bottles} ขวด
                <br><small class="text-muted">(รวมทั้งหมด ${totalBottles} ขวด)</small>
            </div>
        `;
        displaySpeed.className = "alert alert-success fs-4 mb-0";
    }

    // เรียกครั้งแรกเพื่อให้แสดงผลทันที
    updateSpeed();
</script>
</body>
</html>
