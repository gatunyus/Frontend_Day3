<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 2: Change Style (Answer)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 20px; line-height: 1.5; font-family: sans-serif; background-color: #f4f6f9; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">🖥️ Lab 2: Change Style (Answer)</h1>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-dark text-white">
                    2. เปลี่ยนสีสถานะ (Change Style)
                </div>
                <div class="card-body">
                    <div id="machine-status" class="alert alert-success fs-4 text-center fw-bold">
                        สถานะ: ปกติ (Normal)
                    </div>
                    <div class="d-flex flex-column gap-2">
                        <div class="d-flex gap-2">
                            <button class="btn btn-danger w-50 btn-lg" onclick="triggerAlarm()">จำลองความร้อนเกิน!</button>
                            <button class="btn btn-success w-50 btn-lg" onclick="resetStatus()">รีเซ็ตสถานะ</button>
                        </div>
                        <!-- เฉลย: เพิ่มปุ่ม Maintenance -->
                        <button class="btn btn-warning btn-lg w-100" onclick="setMaintenance()">แจ้งซ่อมบำรุง (Maintenance)</button>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const statusBox = document.getElementById("machine-status");

    function triggerAlarm() {
        statusBox.className = "alert alert-danger fs-4 text-center fw-bold"; 
        statusBox.innerText = "สถานะ: แจ้งเตือนอุณหภูมิสูง! (WARNING)";
        // เฉลย: ปรับสไตล์เพิ่มเติม
        statusBox.style.fontWeight = "900";
        statusBox.style.fontStyle = "normal";
    }

    function resetStatus() {
        statusBox.className = "alert alert-success fs-4 text-center fw-bold";
        statusBox.innerText = "สถานะ: ปกติ (Normal)";
        statusBox.style.fontStyle = "normal";
        statusBox.style.fontWeight = "bold";
    }

    // เฉลย: ฟังก์ชัน Maintenance
    function setMaintenance() {
        statusBox.className = "alert alert-warning fs-4 text-center fw-bold";
        statusBox.innerText = "สถานะ: กำลังซ่อมบำรุง (Maintenance)";
        statusBox.style.fontStyle = "italic"; // ทำให้ตัวเอียง
    }
</script>
</body>
</html>
