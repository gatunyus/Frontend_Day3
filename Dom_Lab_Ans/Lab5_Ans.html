<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5: Disable/Enable (Answer)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 20px; line-height: 1.5; font-family: sans-serif; background-color: #f4f6f9; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">🖥️ Lab 5: Disable/Enable (Answer)</h1>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-secondary text-white">
                    5. ล็อกการกดปุ่ม (Disable Button)
                </div>
                <div class="card-body text-center">
                    <div class="d-flex gap-2">
                        <button id="start-btn" class="btn btn-success btn-lg w-50" onclick="startProcess()">▶️ เริ่มสายพาน</button>
                        <button id="stop-btn" class="btn btn-danger btn-lg w-50" onclick="stopProcess()" disabled>🛑 หยุดการทำงาน</button>
                    </div>
                    <!-- เฉลย: ปุ่ม Emergency Stop -->
                    <button id="estop-btn" class="btn btn-dark btn-lg w-100 mt-3" onclick="emergencyStop()">🆘 EMERGENCY STOP</button>
                    
                    <p id="process-status" class="mt-3 text-muted">พร้อมทำงาน</p>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const btnStart = document.getElementById("start-btn");
    const btnStop = document.getElementById("stop-btn");
    const btnEStop = document.getElementById("estop-btn"); // เพิ่มการอ้างอิงปุ่ม E-Stop
    const statusText = document.getElementById("process-status");

    let isEmergency = false; // ตัวแปรเก็บสถานะการหยุดฉุกเฉิน

    function startProcess() {
        if (isEmergency) return; // ป้องกันการเริ่มระบบถ้ายังติด E-Stop
        btnStart.disabled = true;
        btnStart.innerText = "🟢 เครื่องจักรกำลังรัน";
        btnStop.disabled = false;
        statusText.innerText = "สถานะ: สายพานกำลังทำงานปกติ";
    }

    function stopProcess() {
        if (isEmergency) return; // ป้องกันการกดหยุด(ปกติ)ถ้ายังติด E-Stop
        btnStart.disabled = false;
        btnStart.innerText = "▶️ เริ่มสายพาน";
        btnStop.disabled = true;
        statusText.innerText = "สถานะ: หยุดการทำงาน";
    }

    // ฟังก์ชันหยุดฉุกเฉินแบบ Toggle (กดสลับไปมาได้)
    function emergencyStop() {
        if (!isEmergency) {
            // --- เข้าสู่โหมดฉุกเฉิน ---
            isEmergency = true;
            btnStart.disabled = true;
            btnStop.disabled = true;
            btnStart.innerText = "❌ ระงับการใช้งาน";
            
            // เปลี่ยนหน้าตาปุ่ม E-Stop ให้รู้ว่ากดปลดล็อกได้
            btnEStop.innerText = "🔄 ปลดล็อก EMERGENCY";
            btnEStop.classList.remove("btn-dark");
            btnEStop.classList.add("btn-danger"); 
            
            statusText.innerText = "สถานะ: !!! EMERGENCY STOP !!! กรุณาแจ้งหัวหน้างาน";
            statusText.className = "mt-3 text-danger fw-bold";
        } else {
            // --- ยกเลิกโหมดฉุกเฉิน (กลับสู่สถานะพร้อมทำงาน) ---
            isEmergency = false;
            
            // ปลดล็อกปุ่มเริ่ม และกลับไปอยู่ในสถานะ "หยุดทำงาน" มาตรฐาน
            btnStart.disabled = false;
            btnStop.disabled = true;
            btnStart.innerText = "▶️ เริ่มสายพาน";
            
            // คืนค่าปุ่ม E-Stop กลับเป็นปกติ
            btnEStop.innerText = "🆘 EMERGENCY STOP";
            btnEStop.classList.remove("btn-warning");
            btnEStop.classList.add("btn-dark");
            
            statusText.innerText = "สถานะ: พร้อมทำงาน (ปลดล็อกแล้ว)";
            statusText.className = "mt-3 text-muted";
        }
    }
</script>
</body>
</html>
