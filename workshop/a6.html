<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A7: Production Dashboard Summary</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.95);
            --primary-teal: #0d6efd;
            --bom-bg: #acf23cba;
            --input-bg: #fdfdfd;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Prompt', sans-serif;
            min-height: 100vh;
            padding: 40px 0;
            color: #2c3e50;
        }

        .main-container {
            max-width: 1000px;
            margin: auto;
        }

        .section-card {
            background: var(--glass-bg);
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .section-header {
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h5 {
            margin: 0;
            font-weight: 700;
            color: #34495e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-badge {
            background: #eef2f7;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #7f8c8d;
        }

        .form-label {
            font-weight: 600;
            color: #5d6d7e;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #dee2e6;
            padding: 12px 15px;
            background-color: var(--input-bg);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-teal);
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
        }

        /* Section 4 Style (Inspired by a5-2) */
        .bom-card {
            background-color: var(--bom-bg);
            border-radius: 15px;
            border: none;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .bom-card-header {
            padding: 15px 25px;
            background: transparent;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .bom-card-body {
            background: #fff;
            padding: 25px;
            border-radius: 0 0 15px 15px;
        }

        .input-group-text {
            background-color: #f8f9fa;
            border-radius: 0 10px 10px 0 !important;
            font-weight: 600;
            color: #6c757d;
        }

        .search-btn {
            border-radius: 10px;
            padding: 10px 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 20px 0;
        }

    </style>
</head>
<body>

    <div class="container main-container">
        
        <!-- Header -->
        <div class="text-center mb-5">
            <h1 class="fw-bold text-dark">Production Summary</h1>
            <p class="text-muted">ระบบรวบรวมข้อมูลสรุปผลการผลิตรายวัน</p>
        </div>

        <!-- Section 1: PO & Client ID -->
        <div class="card section-card">
            <div class="section-header">
                <h5><i data-lucide="search"></i> Search PO & Client</h5>
                <span class="section-badge">Section 1</span>
            </div>
            <div class="card-body p-4">
                <div class="row align-items-end g-3">
                    <div class="col-md-4">
                        <label class="form-label">Client ID</label>
                        <input type="number" class="form-control" id="client_id" placeholder="ID (1-20)">
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">PO Number</label>
                        <select class="form-select" id="po_select">
                            <option value="" selected disabled>-- เลือกเลขที่ PO --</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100 search-btn py-2" id="btnLoadDetails">
                            <i data-lucide="refresh-cw" class="me-2 d-inline-block align-middle"></i>โหลดข้อมูล
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 2: Production Info -->
        <div class="card section-card">
            <div class="section-header">
                <h5><i data-lucide="info"></i> Production Details</h5>
                <span class="section-badge">Section 2</span>
            </div>
            <div class="card-body p-4">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label">Plant ID</label>
                        <input type="text" class="form-control" id="plant_id">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Line ID</label>
                        <input type="text" class="form-control" id="line_id">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">SKU</label>
                        <input type="text" class="form-control" id="sku">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Plan Pack</label>
                        <input type="text" class="form-control" id="plan_pack">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Qty per Pack</label>
                        <input type="text" class="form-control text-center fw-bold" id="qty_per_pack">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Pack per Pallet</label>
                        <input type="text" class="form-control text-center fw-bold" id="pack_per_pallet">
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 3: Production Results -->
        <div class="card section-card">
            <div class="section-header">
                <h5><i data-lucide="check-circle"></i> Production Results</h5>
                <span class="section-badge">Section 3</span>
            </div>
            <div class="card-body p-4">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label">Start Date</label>
                        <input type="datetime-local" class="form-control" id="start_date">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ending Date</label>
                        <input type="datetime-local" class="form-control" id="ending_date">
                    </div>
                    
                    <div class="divider"></div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-bold text-dark">Output (Total Bottles)</label>
                        <input type="number" class="form-control form-control-lg text-primary fw-bold" id="output" placeholder="กรอกจำนวนขวด...">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Total Pack</label>
                        <input type="text" class="form-control form-control-lg bg-light text-primary fw-bold" id="total_pack" readonly>
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label">Pallet (พาเลท)</label>
                        <input type="text" class="form-control text-center" id="res_pallet" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Pack (เศษแพ็ค)</label>
                        <input type="text" class="form-control text-center" id="res_pack" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Bottle (เศษขวด)</label>
                        <input type="text" class="form-control text-center" id="res_bottle" readonly>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 4: Material BOM Analysis (Dynamic Container) -->
        <div id="bomSection">
            <div class="d-flex align-items-center mb-4 gap-3">
                <h4 class="fw-bold m-0 text-dark">Material BOM Analysis</h4>
                <span class="badge bg-primary rounded-pill">Section 4</span>
            </div>

            <!-- Container สำหรับวาด Card จาก JavaScript -->
            <div id="materialCardsContainer"></div>
        </div>

        <!-- Section 5: Submit -->
        <div class="card section-card mt-5 bg-light border-primary">
            <div class="card-body p-5 text-center">
                <h5 class="mb-4 fw-bold text-dark">บันทึกและส่งข้อมูลสรุป</h5>
                <button class="btn btn-success btn-lg px-5 search-btn" id="btnSubmitAll">
                    <i data-lucide="send" class="me-2 d-inline-block align-middle"></i>Confirm & Send Data
                </button>
                <div id="resultBox" class="mt-4 text-primary fw-bold" style="display:none;"></div>
            </div>
        </div>

    </div>

    <!-- Script Area -->
<script>
        lucide.createIcons();

        const SERVER_URL = "https://intermandibular-cohen-nontalkatively.ngrok-free.dev";
        const WORKSHOP_NAME = "7";
        const FETCH_OPTIONS = {
            method: 'GET',
            headers: { 'ngrok-skip-browser-warning': '69420' }
        };

        const materialCardsContainer = document.getElementById('materialCardsContainer');

        // อัปเดตรายการวัตถุดิบ 16 รายการ ตามโครงสร้าง JSON ใหม่
        const materials = [
            { name: "Syrup", unit: "ลิตร", key: "bom_syrup" },
            { name: "CO2", unit: "กก.", key: "bom_co2" },
            { name: "Preform", unit: "ขวด", key: "bom_preform" },
            { name: "ขวด/กระป๋อง", unit: "ขวด", key: "bom_bt" },
            { name: "ฝา", unit: "ฝา", key: "bom_cap" },
            { name: "ฉลาก", unit: "ชิ้น", key: "bom_label" },
            { name: "กาวฉลาก", unit: "กก.", key: "bom_glue_label" },
            { name: "กาวถาด", unit: "กก.", key: "bom_glue_tray" },
            { name: "ถาดกระดาษ", unit: "แผ่น", key: "bom_tray" },
            { name: "บาร์โค๊ดแพ็ค", unit: "ชิ้น", key: "bom_barcode_pk" },
            { name: "บาร์โค๊ดพาเลท", unit: "ชิ้น", key: "bom_barcode_pl" },
            { name: "ฟิล์มหุ้มแพ็ค step1", unit: "กก.", key: "bom_film_step1" },
            { name: "ฟิล์มหุ้มแพ็ค step2", unit: "กก.", key: "bom_film_step2" },
            { name: "แผ่นรอง บน", unit: "แผ่น", key: "bom_sheet_top" },
            { name: "แผ่นรอง", unit: "แผ่น", key: "bom_sheet" },
            { name: "ฟิล์มยืดพันพาเลท", unit: "กก.", key: "bom_wrap" }
        ];

        // ฟังก์ชันคำนวณ Loss ในตาราง BOM
        function calculateBOMLoss(key) {
            const useInput = document.getElementById(`${key}_use`);
            const bomInput = document.getElementById(`${key}_bom`);
            
            if (!useInput || !bomInput) return;

            const use = parseFloat(useInput.value) || 0;
            const bom = parseFloat(bomInput.value) || 0;
            
            const loss = use - bom;
            const percentLoss = bom !== 0 ? (loss / bom) * 100 : 0;
            
            document.getElementById(`${key}_loss`).value = loss.toFixed(2);
            document.getElementById(`${key}_percent_loss`).value = percentLoss.toFixed(2);
        }

        // ฟังก์ชันวาด Card วัตถุดิบ (Dynamic) - สร้างแค่โครงสร้าง HTML ตอนเริ่มต้น
        function renderBOM() {
            materialCardsContainer.innerHTML = '';
            materials.forEach((m) => {
                const cardHtml = `
                <div class="card bom-card shadow-sm mb-3">
                    <div class="bom-card-header d-flex justify-content-between align-items-center bg-light p-2 border-bottom">
                        <span class="fw-bold">${m.name}</span>
                        <small class="opacity-75">หน่วย: ${m.unit}</small>
                    </div>
                    <div class="bom-card-body p-3">
                        <div class="row g-3 justify-content-center">
                            <div class="col-md-3">
                                <label class="small text-muted d-block mb-1 text-center">Use</label>
                                <input type="number" step="any" class="form-control text-center fw-bold fs-5 border-primary" 
                                       id="${m.key}_use" value="0" oninput="calculateBOMLoss('${m.key}')">
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted d-block mb-1 text-center">Bom</label>
                                <input type="number" class="form-control text-center bg-light" 
                                       id="${m.key}_bom" value="0" readonly>
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted d-block mb-1 text-center text-danger">Loss</label>
                                <input type="number" class="form-control text-center text-danger fw-bold bg-light" 
                                       id="${m.key}_loss" value="0" readonly>
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted d-block mb-1 text-center">% Loss</label>
                                <div class="input-group">
                                    <input type="number" class="form-control text-center bg-light" 
                                           id="${m.key}_percent_loss" value="0" readonly>
                                    <span class="input-group-text">%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
                materialCardsContainer.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        const poSelect = document.getElementById('po_select');
        let allPOData = []; 

        // 1. ฟังก์ชันโหลดรายการ PO มาใส่ใน Dropdown
        async function loadPOs() {
            try {
                const res = await fetch(`${SERVER_URL}/API/get_po.php`, FETCH_OPTIONS);
                const data = await res.json();
                if (data.success && data.data) {
                    allPOData = data.data;
                    poSelect.innerHTML = '<option value="" selected disabled>-- เลือกเลขที่ PO --</option>';
                    allPOData.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item.po_no;
                        opt.innerText = item.po_no;
                        poSelect.appendChild(opt);
                    });
                }
            } catch (err) { console.error(err); }
        }

        // 2. ฟังก์ชันคำนวณผลผลิตแบบ Reactive
        function updateCalculations() {
            const totalBottles = parseFloat(document.getElementById('output').value) || 0;
            const qtyPerPack = parseFloat(document.getElementById('qty_per_pack').value) || 1;
            const packsPerPallet = parseFloat(document.getElementById('pack_per_pallet').value) || 1;

            const bottlesPerPallet = qtyPerPack * packsPerPallet;
            
            // คำนวณ Pack รวม
            const totalPack = totalBottles / qtyPerPack;
            document.getElementById('total_pack').value = parseFloat(totalPack).toFixed(0);

            // คำนวณแบบแยกหน่วย (พาเลท, แพ็คเศษ, ขวดเศษ)
            const pallets = Math.floor(totalBottles / bottlesPerPallet);
            const remainderAfterPallets = totalBottles % bottlesPerPallet;

            const packs = Math.floor(remainderAfterPallets / qtyPerPack);
            const bottles = Math.round(remainderAfterPallets % qtyPerPack);

            document.getElementById('res_pallet').value = pallets;
            document.getElementById('res_pack').value = packs;
            document.getElementById('res_bottle').value = bottles;

            // อัปเดต BOM แบบ Real-time ตาม Output
            const selectedPO = poSelect.value;
            const poData = allPOData.find(item => item.po_no === selectedPO);
            
            if (poData) {
                // แทนที่จะสร้าง Card ใหม่ เราแค่อัปเดตค่า Value ใน Input
                materials.forEach(m => {
                    // ดึงค่า BOM จาก JSON ถ้าไม่มีให้เป็น 0
                    const stdBom = parseFloat(poData[m.key]) || 0;
                    
                    // คำนวณ BOM = มาตรฐานในฐานข้อมูล * ยอด Output ที่ user ใส่
                    const calculatedBom = stdBom * totalBottles; 
                    
                    const bomInput = document.getElementById(`${m.key}_bom`);
                    if (bomInput) {
                        // โชว์ทศนิยม 2 ตำแหน่ง (ปรับแก้ได้ถ้าต้องการโชว์ละเอียดกว่านี้)
                        bomInput.value = calculatedBom.toFixed(2); 
                    }
                    // อัปเดตผลลบ Loss ทันที
                    calculateBOMLoss(m.key);
                });
            }
        }

        // 3. ฟังก์ชันแสดงรายละเอียด PO
        function displayPODetails() {
            const selectedPO = poSelect.value;
            const poData = allPOData.find(item => item.po_no === selectedPO);
            
            if (poData) {
                document.getElementById('plant_id').value = poData.plant_code || '';
                document.getElementById('line_id').value = poData.line_id || '';
                document.getElementById('sku').value = poData.mat_id || '';
                document.getElementById('plan_pack').value = poData.plan_pack || 0;
                document.getElementById('qty_per_pack').value = poData.qty_per_pack || 0;
                document.getElementById('pack_per_pallet').value = poData.pack_per_pallet || 0;

                document.getElementById('start_date').value = poData.start_date || '';
                document.getElementById('ending_date').value = poData.ending_date || '';
                
                // รีเซ็ต Output เป็น 0 และคำนวณ BOM ใหม่ตาม PO ที่เลือก
                document.getElementById('output').value = 0; 
                updateCalculations();

                // Notify Dashboard
                const clientId = document.getElementById('client_id').value || 0;
                fetch(`${SERVER_URL}/API/api.php?client_id=${clientId}&ws=${WORKSHOP_NAME}&data=Load PO No: ${selectedPO}`, FETCH_OPTIONS);
            }
        }

        // เรียกโหลดข้อมูลครั้งแรก
        loadPOs();
        renderBOM(); // สร้างการ์ดเปล่ารอไว้เลยตั้งแต่โหลดหน้าเว็บ

        // --- เชื่อมต่อ Event Listeners ---
        document.getElementById('btnLoadDetails').addEventListener('click', displayPODetails);
        poSelect.addEventListener('change', displayPODetails);
        
        // เมื่อเปลี่ยนค่าใดๆ ที่เกี่ยวกับการคำนวณ ให้รีคำนวณทันที
        document.getElementById('output').addEventListener('input', updateCalculations);
        document.getElementById('qty_per_pack').addEventListener('input', updateCalculations);
        document.getElementById('pack_per_pallet').addEventListener('input', updateCalculations);

        // 3. ฟังก์ชันส่งข้อมูลไปยัง save_po.php
        document.getElementById('btnSubmitAll').addEventListener('click', async () => {
            const btn = document.getElementById('btnSubmitAll');
            const resBox = document.getElementById('resultBox');
            const clientId = document.getElementById('client_id').value;
            const poNo = document.getElementById('po_select').value;

            if(!clientId) { alert("กรุณาระบุ Client ID"); return; }
            if(!poNo) { alert("กรุณาเลือก PO ก่อนครับ"); return; }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving Data...';

            try {
                // --- รวบรวมข้อมูล Section 3 ---
                const productionData = {
                    po_no: poNo,
                    client_id: clientId,
                    plant_code: document.getElementById('plant_id').value,
                    line_id: document.getElementById('line_id').value,
                    start_date: document.getElementById('start_date').value,
                    ending_date: document.getElementById('ending_date').value,
                    output: document.getElementById('output').value,
                    total_pack: document.getElementById('total_pack').value,
                    res_pallet: document.getElementById('res_pallet').value,
                    res_pack: document.getElementById('res_pack').value,
                    res_bottle: document.getElementById('res_bottle').value
                };

                // --- รวบรวมข้อมูล Section 4 (Loop ทั้ง 16 รายการ) ---
                const materialData = {};
                materials.forEach(m => {
                    materialData[`${m.key}_use`] = document.getElementById(`${m.key}_use`).value || 0;
                    materialData[`${m.key}`] = document.getElementById(`${m.key}_bom`).value || 0; // ใช้ชื่อ key เพียวๆ เช่น bom_syrup
                    materialData[`${m.key}_loss`] = document.getElementById(`${m.key}_loss`).value || 0;
                });

                // รวมข้อมูลทั้งหมด
                const allData = { ...productionData, materials: materialData };

                // ผสม FETCH_OPTIONS เดิมเข้ากับ POST เพื่อให้ได้ Headers ของ Ngrok และรูปแบบที่สม่ำเสมอ
                const postOptions = {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': '69420'
                    },
                    body: JSON.stringify(allData)
                };

                // เรียก API
                const res = await fetch(`${SERVER_URL}/API/save_po.php`, postOptions);
                const data = await res.json();            
                
                if (data.success) {
                    resBox.style.display = 'block';
                    resBox.className = "alert alert-success mt-3";
                    resBox.innerText = "✅ " + (data.reply || "บันทึกข้อมูลลงฐานข้อมูลเรียบร้อยแล้ว");

                    // 🚀 Notify Dashboard ว่าบันทึกข้อมูลสำเร็จแล้ว
                    fetch(`${SERVER_URL}/API/api.php?client_id=${clientId}&ws=${WORKSHOP_NAME}&data=Finished PO: ${poNo}`, FETCH_OPTIONS);
                }
            } catch (err) {
                console.error(err);
                resBox.style.display = 'block';
                resBox.className = "alert alert-danger mt-3";
                resBox.innerText = "❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล";
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="save" class="me-2 d-inline-block align-middle"></i>บันทึกรายงานการผลิต';
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
