<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A7: Production History & Report</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.95);
            --primary-blue: #0d6efd;
            --danger-red: #dc3545;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Prompt', sans-serif;
            min-height: 100vh;
            padding: 40px 0;
            color: #2c3e50;
        }

        .main-container {
            max-width: 1200px;
            margin: auto;
        }

        .section-card {
            background: var(--glass-bg);
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            overflow: hidden;
        }

        .section-header {
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
            background-color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h5 {
            margin: 0;
            font-weight: 700;
            color: #34495e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-badge {
            background: #eef2f7;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #7f8c8d;
        }
        .section-badge {
            background: #eef2f7;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #7f8c8d;
        }
        
        .form-label {
            font-weight: 600;
            color: #5d6d7e;
            font-size: 0.9rem;
        }

        .table-container {
            padding: 20px;
            background: #fff;
        }

        .table thead th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            color: #5d6d7e;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .btn-action {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-excel {
            background-color: #1d6f42;
            color: white;
            border: none;
        }

        .btn-excel:hover {
            background-color: #155231;
            color: white;
            transform: translateY(-2px);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
        }

    </style>
</head>
<body>
    <div class="container main-container">
        
        <!-- Header Area -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark m-0">Production Report</h2>
                <p class="text-muted m-0">ประวัติการบันทึกรายงานการผลิตทั้งหมด</p>
            </div>
            <button class="btn btn-excel btn-lg shadow-sm" onclick="exportToExcel()">
                <i data-lucide="file-spreadsheet" class="me-2 d-inline-block align-middle"></i>Export Excel
            </button>
        </div>

        <!-- Section 1: Search & Filter -->
        <div class="card section-card mb-4">
            <div class="section-header">
                <h5><i data-lucide="filter"></i> Search Filters</h5>
                <span class="section-badge">Section 1</span>
            </div>
            <div class="card-body p-4">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">Client ID</label>
                        <input type="number" class="form-control" id="client_id" placeholder="ID (1-20)">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Plant ID</label>
                        <select class="form-select" id="search_plant">
                            <option value="">-- All Plants --</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Line ID</label>
                        <select class="form-select" id="search_line">
                            <option value="">-- All Lines --</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Production Date</label>
                        <select class="form-select" id="search_date">
                            <option value="">-- All Dates --</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-primary w-100 py-2 fw-bold" onclick="loadReports()">
                            <i data-lucide="search" class="me-1 d-inline-block align-middle"></i>Search
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 2: Data Table -->
        <div class="card section-card">
            <div class="section-header">
                <h5><i data-lucide="list"></i> Production Table</h5>
                <div class="d-flex gap-2 align-items-center">
                    <span class="badge bg-light text-dark border" id="record_count">0 records found</span>
                    <span class="section-badge">Section 2</span>
                </div>
            </div>
            <div class="table-container">
                <div class="table-responsive">
                    <table class="table table-hover align-middle" id="reportTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>PO Number</th>
                                <th>Plant/Line</th>
                                <th class="text-center">Bottle Output</th>
                                <th class="text-center">BOM Use (Avg)</th>
                                <th class="text-center">Loss (Avg)</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reportData">
                            <!-- Data will be loaded here -->
                            <tr>
                                <td colspan="7" class="text-center py-5 text-muted">
                                    <div class="spinner-border spinner-border-sm me-2"></div> กำลังโหลดข้อมูล...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Script Area -->
    <script>
        lucide.createIcons();

        const WORKSHOP_NAME = "7";
        const SERVER_URL = "https://intermandibular-cohen-nontalkatively.ngrok-free.dev";
        const FETCH_OPTIONS = {
            method: 'GET',
            headers: { 'ngrok-skip-browser-warning': '69420' }
        };

        let allReports = [];

        // 0. โหลดตัวเลือกสำหรับ Dropdown (Plant, Line, Date)
        async function loadFilterOptions() {
            try {
                const res = await fetch(`${SERVER_URL}/API/get_po_filter.php`, FETCH_OPTIONS);
                const data = await res.json();
                
                if (data.success) {
                    populateSelect('search_plant', data.plants, "-- All Plants --");
                    populateSelect('search_line', data.lines, "-- All Lines --");
                    populateSelect('search_date', data.dates, "-- All Dates --");
                }
            } catch (err) { console.error("Load filters failed", err); }
        }

        function populateSelect(id, list, defaultText) {
            const el = document.getElementById(id);
            el.innerHTML = `<option value="">${defaultText}</option>`;
            list.forEach(val => {
                if(val) {
                    const opt = document.createElement('option');
                    opt.value = val; opt.innerText = val;
                    el.appendChild(opt);
                }
            });
        }

        // 1. โหลดข้อมูลรายงานจากฐานข้อมูล (เรียกเมื่อกด Search เท่านั้น)
        async function loadReports() {
            const plantVal = document.getElementById('search_plant').value;
            const lineVal = document.getElementById('search_line').value;
            const dateVal = document.getElementById('search_date').value;

            const container = document.getElementById('reportData');
            container.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> กำลังค้นหาข้อมูล...</td></tr>';

            try {
                const params = new URLSearchParams({
                    plant_id: plantVal,
                    line_id: lineVal,
                    date: dateVal
                });

                const res = await fetch(`${SERVER_URL}/API/get_po_reports.php?${params.toString()}`, FETCH_OPTIONS);
                const data = await res.json();
                
                if (data.success && data.reports) {
                    allReports = data.reports;
                    renderTable(allReports);

                    // 🚀 Notify Dashboard ว่ามีการค้นหาข้อมูล
                    const clientId = document.getElementById('client_id').value || 0;
                    fetch(`${SERVER_URL}/API/api.php?client_id=${clientId}&ws=${WORKSHOP_NAME}&data=Search Report : ${plantVal}/${lineVal}/${dateVal}`, FETCH_OPTIONS);
                } else {
                    container.innerHTML = '<tr><td colspan="7" class="text-center text-danger">ไม่พบข้อมูลตามเงื่อนไขที่ระบุ</td></tr>';
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<tr><td colspan="7" class="text-center text-danger">เกิดข้อผิดพลาดในการเชื่อมต่อ</td></tr>';
            }
        }

        // 2. ฟังก์ชันกรองข้อมูล (Reactive Search)
        function filterData() {
            const plantVal = document.getElementById('search_plant').value.toLowerCase();
            const lineVal = document.getElementById('search_line').value.toLowerCase();
            const dateVal = document.getElementById('search_date').value;

            const filtered = allReports.filter(item => {
                const matchPlant = item.plant_id.toLowerCase().includes(plantVal);
                const matchLine = item.line_id.toLowerCase().includes(lineVal);
                const matchDate = dateVal ? item.start_date.includes(dateVal) : true;
                return matchPlant && matchLine && matchDate;
            });

            renderTable(filtered);
        }

        // 3. วาดตารางข้อมูล
        function renderTable(data) {
            const container = document.getElementById('reportData');
            const countLabel = document.getElementById('record_count');
            container.innerHTML = '';
            countLabel.innerText = `${data.length} records found`;

            if (data.length === 0) {
                container.innerHTML = '<tr><td colspan="7" class="text-center py-4">ไม่พบข้อมูลที่ตรงตามเงื่อนไข</td></tr>';
                return;
            }

            data.forEach(item => {
                // คำนวณค่าเฉลี่ย Loss เพื่อโชว์ในตารางเบื้องต้น
                // (ในระบบจริงอาจจะดึงค่านำหน้ามาโชว์ตัวเดียว หรือคำนวณจากยอดรวม)
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="small fw-bold">${item.start_date.split(' ')[0]}</td>
                    <td><span class="badge bg-primary-subtle text-primary border border-primary-subtle px-2">${item.po_no}</span></td>
                    <td><small>${item.plant_id} / ${item.line_id}</small></td>
                    <td class="text-center fw-bold text-dark">${parseFloat(item.output_bottles).toLocaleString()}</td>
                    <td class="text-center text-muted">${parseFloat(item.bom_syrup_use || 0).toFixed(2)}</td>
                    <td class="text-center text-danger fw-bold">
                        ${(parseFloat(item.bom_syrup_use || 0) - 100).toFixed(2)} 
                    </td>
                    <td class="text-end">
                        <div class="btn-group">
                            <button class="btn btn-outline-primary btn-action" onclick="editRecord(${item.id})">Edit</button>
                            <button class="btn btn-outline-danger btn-action" onclick="removeRecord(${item.id})">Remove</button>
                        </div>
                    </td>
                `;
                container.appendChild(tr);
            });
        }

        // 4. ฟังก์ชันจัดการข้อมูล (Edit / Remove)
        function editRecord(id) {
            window.location.href = `workshop8.html?id=${id}&action=edit`;
        }

        function removeRecord(id) {
            window.location.href = `workshop8.html?id=${id}&action=remove`;
        }

        // 5. ฟังก์ชัน Export Excel (แบบง่าย)
        function exportToExcel() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Date,PO Number,Plant,Line,Output,Use,Loss\n";
            
            allReports.forEach(r => {
                csvContent += `${r.start_date},${r.po_no},${r.plant_id},${r.line_id},${r.output_bottles},${r.bom_syrup_use},0\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "production_report.csv");
            document.body.appendChild(link);
            link.click();
        }

        // เริ่มโหลดตัวเลือก
        loadFilterOptions();

        document.getElementById('reportData').innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">กรุณาระบุเงื่อนไขและกด Search เพื่อดูข้อมูล</td></tr>';

        // เพิ่ม Event Listeners สำหรับการค้นหา (เปลี่ยนเป็น change สำหรับ dropdown)
        document.getElementById('search_plant').addEventListener('change', filterData);
        document.getElementById('search_line').addEventListener('change', filterData);
        document.getElementById('search_date').addEventListener('change', filterData);

    </script>
</body>
</html>
