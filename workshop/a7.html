<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A7: Production History & Report</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.95);
            --primary-blue: #0d6efd;
            --danger-red: #dc3545;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Prompt', sans-serif;
            min-height: 100vh;
            padding: 40px 0;
            color: #2c3e50;
        }

        .main-container {
            max-width: 1200px;
            margin: auto;
        }

        .section-card {
            background: var(--glass-bg);
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            overflow: hidden;
        }

        .section-header {
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
            background-color: #fff;
        }

        .section-header h5 {
            margin: 0;
            font-weight: 700;
            color: #34495e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-label {
            font-weight: 600;
            color: #5d6d7e;
            font-size: 0.9rem;
        }

        .table-container {
            padding: 20px;
            background: #fff;
        }

        .table thead th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            color: #5d6d7e;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .btn-action {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-excel {
            background-color: #1d6f42;
            color: white;
            border: none;
        }

        .btn-excel:hover {
            background-color: #155231;
            color: white;
            transform: translateY(-2px);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
        }

    </style>
</head>
<body>

    <div class="container main-container">
        
        <!-- Header Area -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark m-0">Production Report</h2>
                <p class="text-muted m-0">ประวัติการบันทึกรายงานการผลิตทั้งหมด</p>
            </div>
            <button class="btn btn-excel btn-lg shadow-sm" onclick="exportToExcel()">
                <i data-lucide="file-spreadsheet" class="me-2 d-inline-block align-middle"></i>Export Excel
            </button>
        </div>

        <!-- Section 1: Search & Filter -->
        <div class="card section-card mb-4">
            <div class="section-header">
                <h5><i data-lucide="filter"></i> Section 1: Search Filters</h5>
            </div>
            <div class="card-body p-4">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Plant ID</label>
                        <input type="text" class="form-control" id="search_plant" placeholder="ค้นหาโรงงาน...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Line ID</label>
                        <input type="text" class="form-control" id="search_line" placeholder="ค้นหาไลน์การผลิต...">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Production Date</label>
                        <input type="date" class="form-control" id="search_date">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-primary w-100 py-2 fw-bold" onclick="loadReports()">
                            <i data-lucide="search" class="me-1 d-inline-block align-middle"></i>Search
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 2: Data Table -->
        <div class="card section-card">
            <div class="section-header d-flex justify-content-between align-items-center">
                <h5><i data-lucide="list"></i> Section 2: Production Table</h5>
                <span class="badge bg-light text-dark border" id="record_count">0 records found</span>
            </div>
            <div class="table-container">
                <div class="table-responsive">
                    <table class="table table-hover align-middle" id="reportTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>PO Number</th>
                                <th>Plant/Line</th>
                                <th class="text-center">Bottle Output</th>
                                <th class="text-center">BOM Use (Avg)</th>
                                <th class="text-center">Loss (Avg)</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reportData">
                            <!-- Data will be loaded here -->
                            <tr>
                                <td colspan="7" class="text-center py-5 text-muted">
                                    <div class="spinner-border spinner-border-sm me-2"></div> กำลังโหลดข้อมูล...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Script Area -->
    <script>
        lucide.createIcons();

        const SERVER_URL = "https://intermandibular-cohen-nontalkatively.ngrok-free.dev";
        const FETCH_OPTIONS = {
            method: 'GET',
            headers: { 'ngrok-skip-browser-warning': '69420' }
        };

        let allReports = [];

        // 1. โหลดข้อมูลรายงานจากฐานข้อมูล
        async function loadReports() {
            try {
                // สมมติว่ามี API สำหรับดึงรายงาน
                const res = await fetch(`${SERVER_URL}/API/get_reports.php`, FETCH_OPTIONS);
                const data = await res.json();
                
                if (data.success) {
                    allReports = data.reports;
                    filterData(); // กรองข้อมูลตาม Search Box
                } else {
                    document.getElementById('reportData').innerHTML = '<tr><td colspan="7" class="text-center text-danger">ไม่พบข้อมูลรายงาน</td></tr>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('reportData').innerHTML = '<tr><td colspan="7" class="text-center text-danger">เกิดข้อผิดพลาดในการเชื่อมต่อ</td></tr>';
            }
        }

        // 2. ฟังก์ชันกรองข้อมูล (Reactive Search)
        function filterData() {
            const plantVal = document.getElementById('search_plant').value.toLowerCase();
            const lineVal = document.getElementById('search_line').value.toLowerCase();
            const dateVal = document.getElementById('search_date').value;

            const filtered = allReports.filter(item => {
                const matchPlant = item.plant_id.toLowerCase().includes(plantVal);
                const matchLine = item.line_id.toLowerCase().includes(lineVal);
                const matchDate = dateVal ? item.start_date.includes(dateVal) : true;
                return matchPlant && matchLine && matchDate;
            });

            renderTable(filtered);
        }

        // 3. วาดตารางข้อมูล
        function renderTable(data) {
            const container = document.getElementById('reportData');
            const countLabel = document.getElementById('record_count');
            container.innerHTML = '';
            countLabel.innerText = `${data.length} records found`;

            if (data.length === 0) {
                container.innerHTML = '<tr><td colspan="7" class="text-center py-4">ไม่พบข้อมูลที่ตรงตามเงื่อนไข</td></tr>';
                return;
            }

            data.forEach(item => {
                // คำนวณค่าเฉลี่ย Loss เพื่อโชว์ในตารางเบื้องต้น
                // (ในระบบจริงอาจจะดึงค่านำหน้ามาโชว์ตัวเดียว หรือคำนวณจากยอดรวม)
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="small fw-bold">${item.start_date.split(' ')[0]}</td>
                    <td><span class="badge bg-primary-subtle text-primary border border-primary-subtle px-2">${item.po_no}</span></td>
                    <td><small>${item.plant_id} / ${item.line_id}</small></td>
                    <td class="text-center fw-bold text-dark">${parseFloat(item.output_bottles).toLocaleString()}</td>
                    <td class="text-center text-muted">${parseFloat(item.bom_syrup_use || 0).toFixed(2)}</td>
                    <td class="text-center text-danger fw-bold">
                        ${(parseFloat(item.bom_syrup_use || 0) - 100).toFixed(2)} 
                    </td>
                    <td class="text-end">
                        <div class="btn-group">
                            <button class="btn btn-outline-primary btn-action" onclick="editRecord(${item.id})">Edit</button>
                            <button class="btn btn-outline-danger btn-action" onclick="removeRecord(${item.id})">Remove</button>
                        </div>
                    </td>
                `;
                container.appendChild(tr);
            });
        }

        // 4. ฟังก์ชันจัดการข้อมูล (Edit / Remove)
        function editRecord(id) {
            alert("ฟีเจอร์แก้ไข ID: " + id + " กำลังพัฒนา...");
        }

        async function removeRecord(id) {
            if (!confirm("คุณต้องการลบรายงาน ID: " + id + " ใช่หรือไม่? (ไม่สามารถย้อนกลับได้)")) return;

            try {
                const res = await fetch(`${SERVER_URL}/API/remove_report.php?id=${id}`, FETCH_OPTIONS);
                const data = await res.json();
                if (data.success) {
                    alert("ลบข้อมูลสำเร็จ!");
                    loadReports(); // โหลดข้อมูลใหม่
                }
            } catch (err) { alert("เกิดข้อผิดพลาดในการลบข้อมูล"); }
        }

        // 5. ฟังก์ชัน Export Excel (แบบง่าย)
        function exportToExcel() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Date,PO Number,Plant,Line,Output,Use,Loss\n";
            
            allReports.forEach(r => {
                csvContent += `${r.start_date},${r.po_no},${r.plant_id},${r.line_id},${r.output_bottles},${r.bom_syrup_use},0\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "production_report.csv");
            document.body.appendChild(link);
            link.click();
        }

        // เริ่มโหลดข้อมูล
        loadReports();

        // เพิ่ม Event Listeners สำหรับการค้นหา
        document.getElementById('search_plant').addEventListener('input', filterData);
        document.getElementById('search_line').addEventListener('input', filterData);
        document.getElementById('search_date').addEventListener('change', filterData);

    </script>
</body>
</html>
