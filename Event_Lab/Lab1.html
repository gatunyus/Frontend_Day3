<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Lab 1: Click Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f4f6f9; font-size: 20px; }</style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">🖥️ Event Lab 1: Click Event</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">1. ดักจับการคลิก (Click)</div>
                <div class="card-body text-center">
                    <button id="check-btn" class="btn btn-primary btn-lg w-100">🔍 ตรวจสอบสถานะเครื่องจักร</button>
                    
                    <div id="status-panel" class="alert alert-info mt-4 fs-4" style="display: none;">
                        ✅ สถานะ: เครื่องจักรกำลังทำงานตามปกติ
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    // 1. อ้างอิงถึง Element ในหน้าจอ
    const checkBtn = document.getElementById("check-btn");
    const statusPanel = document.getElementById("status-panel");

    /* 
      📝 ส่วนเสริมความเข้าใจ:
      addEventListener() ทำหน้าที่ "ดักฟัง" หรือ "รอรับ" เหตุการณ์ที่เกิดขึ้นกับ Element นั้นๆ
      โดยรับค่า 2 อย่างคือ:
      1. ชื่อเหตุการณ์ (เช่น "click")
      2. ฟังก์ชันที่จะให้ทำงานเมื่อเกิดเหตุการณ์นั้น
    */

    // 2. สั่งให้ปุ่ม รอรับการ "click"
    checkBtn.addEventListener("click", function() {
        // เมื่อปุ่มถูกคลิก จะเข้ามาทำงานในบล็อกนี้
        
        // สั่งเปลี่ยน CSS เพื่อให้กรอบแสดงผลปรากฏขึ้น
        statusPanel.style.display = "block";
        
        // เปลี่ยนข้อความบนปุ่ม เพื่อให้รู้ว่ากดไปแล้ว
        checkBtn.innerText = "ตรวจสอบเรียบร้อยแล้ว!";
        // ลบความเป็นปุ่มและเปลี่ยนสี
        checkBtn.className = "btn btn-success btn-lg w-100 disabled";
    });
</script>
</body>
</html>
