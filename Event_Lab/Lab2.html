<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Lab 2: Input Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f4f6f9; font-size: 20px; }</style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">🖥️ Event Lab 2: Input Event</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">2. ดักจับการพิมพ์ข้อความ (Input)</div>
                <div class="card-body">
                    <label class="form-label fw-bold">กรอกรหัสพนักงาน:</label>
                    <input type="text" id="emp-input" class="form-control form-control-lg" placeholder="เช่น EMP-01">
                    <div id="feedback" class="form-text text-danger mt-2" style="min-height: 24px;"></div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    // 1. อ้างอิงถึง Element ในหน้าจอ
    const empInput = document.getElementById("emp-input");
    const feedback = document.getElementById("feedback");

    /* 
      📝 ส่วนเสริมความเข้าใจ:
      Event "input" จะทำงานแบบ Real-time ทุกครั้งที่มีการพิมพ์หรือลบข้อความในช่อง Input
      เหมาะกับการทำระบบ Validate ข้อมูลทันทีโดยไม่ต้องรอให้ผู้ใช้กดปุ่ม Submit
    */

    // 2. ดักจับเหตุการณ์ "input" ทันทีที่มีการพิมพ์
    empInput.addEventListener("input", function() {
        // ดึงค่าปัจจุบันที่อยู่ในช่อง Input
        let val = empInput.value;
        
        if (val.length === 0) {
            // ถ้าลบจนหมด ให้ล้างข้อความทิ้ง
            feedback.innerText = ""; 
            empInput.style.borderColor = "";
        } else if (val.length < 6) {
            // ถ้าน้อยกว่า 4 ตัวอักษร ให้แจ้งเตือนสีแดง
            feedback.innerText = "❌ รหัสพนักงานต้องมีอย่างน้อย 6 ตัวอักษร";
            feedback.className = "form-text text-danger mt-2 fw-bold";
            empInput.style.borderColor = "red";
        } else {
            // ถ้าครบ 4 ตัวอักษรขึ้นไป ให้ขึ้นสีเขียวผ่าน
            feedback.innerText = "✅ รหัสถูกต้องพร้อมใช้งาน";
            feedback.className = "form-text text-success mt-2 fw-bold";
            empInput.style.borderColor = "green";
        }
    });
</script>
</body>
</html>
