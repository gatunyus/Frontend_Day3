<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Lab 3: Change Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f4f6f9; font-size: 20px; }</style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">🖥️ Event Lab 3: Change Event</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">3. ดักจับการเปลี่ยนค่า (Change)</div>
                <div class="card-body text-center">
                    <label class="form-label fw-bold d-block text-start">เลือกโหมดการทำงาน:</label>
                    <select id="mode-select" class="form-select form-select-lg mb-3">
                        <option value="">-- กรุณาเลือกโหมด --</option>
                        <option value="slow">🐢 โหมดประหยัดพลังงาน (Slow)</option>
                        <option value="normal">🟢 โหมดปกติ (Normal)</option>
                     
                    </select>
                    
                    <div id="mode-display" class="alert alert-secondary fs-4 mb-0">
                        สถานะปัจจุบัน: ยังไม่ได้เลือก
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    // 1. อ้างอิงถึง Element ในหน้าจอ
    const modeSelect = document.getElementById("mode-select");
    const modeDisplay = document.getElementById("mode-display");

    /* 
      📝 ส่วนเสริมความเข้าใจ:
      Event "change" จะทำงานก็ต่อเมื่อมีการ "เปลี่ยนตัวเลือก" และ "คลิกเลือกเสร็จแล้ว"
      เหมาะกับพวก Dropdown (<select>), Checkbox หรือ Radio Button
    */

    // 2. ดักจับเหตุการณ์ "change"
    modeSelect.addEventListener("change", function() {
        // ดึงค่าที่ผู้ใช้เลือก (value ของ <option>)
        let mode = modeSelect.value;
        
        // ใช้ if-else เพื่อกำหนดข้อความและสีที่แตกต่างกันตามโหมด
        if (mode === "slow") {
            modeDisplay.innerHTML = "🐢 <strong>กำลังทำงาน:</strong> โหมดประหยัดพลังงาน";
            modeDisplay.className = "alert alert-warning fs-4 mb-0";
        } else if (mode === "normal") {
            modeDisplay.innerHTML = "🟢 <strong>กำลังทำงาน:</strong> โหมดปกติ";
            modeDisplay.className = "alert alert-success fs-4 mb-0";
        } else {
            // กรณีเลือกกลับไปที่ "-- กรุณาเลือกโหมด --"
            modeDisplay.innerHTML = "สถานะปัจจุบัน: ยังไม่ได้เลือก";
            modeDisplay.className = "alert alert-secondary fs-4 mb-0";
        }
    });
</script>
</body>
</html>
