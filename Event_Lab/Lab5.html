<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Lab 5: Mouse Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-size: 20px; }
        #hover-box { 
            height: 200px; 
            transition: 0.3s; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px dashed #ccc;
            border-radius: 15px;
            background-color: white;
        }
        .highlight { 
            background-color: #e3f2fd !important; 
            border-color: #2196f3 !important; 
            transform: scale(1.02);
        }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">🖥️ Event Lab 5: Mouse Event</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">5. ดักจับการใช้เมาส์ (Mouse Hover)</div>
                <div class="card-body text-center">
                    <p>ลองเอาเมาส์มาวางในกรอบด้านล่าง</p>
                    
                    <div id="hover-box">
                        <h2 id="box-text">เมาส์อยู่นอกกรอบ</h2>
                    </div>

                    <p id="hint" class="mt-3 text-muted fs-6">mouseenter = เมาส์เข้า | mouseleave = เมาส์ออก</p>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const hoverBox = document.getElementById("hover-box");
    const boxText = document.getElementById("box-text");

    /* 
      📝 ส่วนเสริมความเข้าใจ:
      - "mouseenter": ทำงานเมื่อเมาส์ "เคลื่อนเข้าไป" ในขอบเขตของ Element
      - "mouseleave": ทำงานเมื่อเมาส์ "เคลื่อนออกไป" จากขอบเขตของ Element
      เหมาะกับการทำ Effect ตอบสนอง เช่น ปุ่มขยายใหญ่ขึ้น หรือแสดงคำอธิบายเพิ่มเติม
    */

    // 🎯 โจทย์เสริม: เมื่อเมาส์เข้ามา ให้เปลี่ยนสีตัวหนังสือเป็นสีน้ำเงิน และเมื่อออกให้กลับเป็นสีดำ

    // 1. ดักจับตอนเมาส์เข้า
    hoverBox.addEventListener("mouseenter", function() {
        boxText.innerText = "🎯 เมาส์เข้ามาแล้ว!";
        boxText.style.color = "#0d6efd"; // สีน้ำเงิน
        hoverBox.classList.add("highlight"); // เพิ่ม Class CSS เพื่อความสวยงาม
    });

    // 2. ดักจับตอนเมาส์ออก
    hoverBox.addEventListener("mouseleave", function() {
        boxText.innerText = "เมาส์อยู่นอกกรอบ";
        boxText.style.color = "black";
        hoverBox.classList.remove("highlight"); // เอา Class ออก
    });
</script>
</body>
</html>
