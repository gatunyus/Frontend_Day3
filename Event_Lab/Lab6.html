<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Lab 6: Form Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f4f6f9; font-size: 20px; }</style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">🖥️ Event Lab 6: Form Event</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">6. การส่งฟอร์ม (Form Submit)</div>
                <div class="card-body">
                    <form id="report-form">
                        <div class="mb-3">
                            <label class="form-label">ชื่อผู้แจ้ง:</label>
                            <input type="text" id="reporter-name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">รายละเอียดปัญหา:</label>
                            <textarea id="report-desc" class="form-control" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">ส่งรายงานความผิดปกติ</button>
                    </form>

                    <div id="result-alert" class="alert alert-success mt-4" style="display: none;">
                        <strong>สำเร็จ!</strong> ข้อมูลของคุณถูกส่งแล้วโดยไม่ Refresh หน้าจอ
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const reportForm = document.getElementById("report-form");
    const resultAlert = document.getElementById("result-alert");

    /* 
      📝 ส่วนเสริมความเข้าใจ:
      - Event "submit" จะทำงานเมื่อมีการกดปุ่ม Submit ในฟอร์ม
      - สำคัญมาก: ปกติฟอร์มจะสั่งโหลดหน้าใหม่ (Refresh) อัตโนมัติ
      - เราต้องใช้ "event.preventDefault()" เพื่อหยุดการโหลดหน้าใหม่ 
        เพื่อให้เราประมวลผลข้อมูลด้วย JavaScript ต่อได้เอง (เช่น ส่งผ่าน API)
    */

    // 🎯 โจทย์เสริม: ลองดึงค่าจาก reporter-name มาแสดงใน Alert แจ้งเตือนหลังจากกดปุ่ม

    reportForm.addEventListener("submit", function(event) {
        // 1. ป้องกันไม่ให้หน้าเว็บรีเฟรช (สำคัญที่สุด!)
        event.preventDefault();

        // 2. ดึงข้อมูลจากฟอร์ม
        const name = document.getElementById("reporter-name").value;
        const desc = document.getElementById("report-desc").value;

        console.log("ส่งข้อมูล:", { name, desc });

        // 3. แสดงผลลัพธ์บนหน้าจอ
        resultAlert.style.display = "block";
        resultAlert.innerHTML = `<strong>ขอบคุณคุณ ${name}!</strong> รายงานของคุณคือ: ${desc}`;

        // 4. ล้างข้อมูลในฟอร์ม (Reset)
        reportForm.reset();
    });
</script>
</body>
</html>
