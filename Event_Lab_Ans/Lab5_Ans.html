<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เฉลย Event Lab 5 (Bonus)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-size: 20px; }
        #hover-box { 
            height: 200px; 
            transition: 0.3s; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            justify-content: center;
            border: 3px dashed #ccc; 
            border-radius: 15px; 
            background-color: white;
        }
        .highlight { 
            background-color: #e3f2fd 
            !important; transform: scale(1.02); }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">✅ เฉลย Event Lab 5 (พร้อมโจทย์เสริม)</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">5. ดักจับเมาส์ (Mouse Hover)</div>
                <div class="card-body text-center">
                    <div id="hover-box">
                        <h2 id="box-text">เมาส์อยู่นอกกรอบ</h2>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const hoverBox = document.getElementById("hover-box");
    const boxText = document.getElementById("box-text");

    hoverBox.addEventListener("mouseenter", function() {
        boxText.innerText = "🎯 เมาส์เข้ามาแล้ว!";
        boxText.style.color = "#0d6efd";
        hoverBox.classList.add("highlight");
        
        // เฉลยโจทย์เสริม: เปลี่ยนสไตล์เส้นขอบเป็นเส้นทึบ
        hoverBox.style.borderStyle = "solid";
        hoverBox.style.borderWidth = "5px";
        hoverBox.style.borderColor = "#0d6efd";
    });

    hoverBox.addEventListener("mouseleave", function() {
        boxText.innerText = "เมาส์อยู่นอกกรอบ";
        boxText.style.color = "black";
        hoverBox.classList.remove("highlight");
        
        // เฉลยโจทย์เสริม: กลับเป็นเส้นประเหมือนเดิม
        hoverBox.style.borderStyle = "dashed";
        hoverBox.style.borderWidth = "3px";
        hoverBox.style.borderColor = "#ccc";
    });
</script>
</body>
</html>
