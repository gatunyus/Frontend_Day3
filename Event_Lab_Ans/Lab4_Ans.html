<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เฉลย Event Lab 4 (Bonus)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f4f6f9; font-size: 20px; }</style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">✅ เฉลย Event Lab 4 (พร้อมโจทย์เสริม)</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-info">
                <div class="card-header bg-info text-dark font-weight-bold">4. ดักจับปุ่มกด (Keyboard)</div>
                <div class="card-body">
                    <label class="form-label fw-bold">พิมพ์หมายเหตุ (จำกัด 50 ตัวอักษร):</label>
                    <textarea id="note-input" class="form-control" rows="3"></textarea>
                    
                    <div class="d-flex justify-content-between mt-2">
                        <small id="char-count" class="text-muted">จำนวนตัวอักษร: 0/50</small>
                        <small id="key-info" class="badge bg-secondary">ปุ่มล่าสุด: -</small>
                    </div>

                    <!-- เฉลยโจทย์เสริม: ปุ่มล้างข้อความ -->
                    <button id="clear-btn" class="btn btn-outline-danger mt-3 w-100">🗑️ ล้างข้อความทั้งหมด</button>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const noteInput = document.getElementById("note-input");
    const charCount = document.getElementById("char-count");
    const clearBtn = document.getElementById("clear-btn");
    const keyInfo = document.getElementById("key-info");

    // 1. ดักจับการพิมพ์
    noteInput.addEventListener("keyup", function(e) {
        let len = noteInput.value.length;
        charCount.innerText = `จำนวนตัวอักษร: ${len}/50`;
        keyInfo.innerText = `ปุ่มล่าสุด: ${e.key}`;
        let val = noteInput.value;
        let cutval = val.substring(0, 50);
            
        if (len > 50) {
            charCount.className = "text-danger fw-bold";
            noteInput.style.borderColor = "red";
            noteInput.value = cutval;
        } else {
            charCount.className = "text-muted";
            noteInput.style.borderColor = "";
        }
    });

    // 2. เฉลยโจทย์เสริม: ดักจับปุ่มล้างข้อมูล
    clearBtn.addEventListener("click", function() {
        noteInput.value = ""; // ล้างข้อความ
        charCount.innerText = "จำนวนตัวอักษร: 0/50"; // รีเซ็ตตัวนับ
        charCount.className = "text-muted";
        noteInput.style.borderColor = "";
        keyInfo.innerText = "ปุ่มล่าสุด: -";
    });
</script>
</body>
</html>
