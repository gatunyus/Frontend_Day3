<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เฉลย Event Lab 1 (Bonus)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f4f6f9; font-size: 20px; }</style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">✅ เฉลย Event Lab 1 (พร้อมโจทย์เสริม)</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-primary">
                <div class="card-header bg-primary text-white">1. ดักจับการคลิก (Click)</div>
                <div class="card-body text-center">
                    <button id="check-btn" class="btn btn-primary btn-lg w-100">🔍 ตรวจสอบสถานะเครื่องจักร</button>
                    
                    <div id="status-panel" class="alert alert-info mt-4 fs-4" style="display: none;">
                        ✅ สถานะ: เครื่องจักรกำลังทำงานตามปกติ
                    </div>

                    <!-- โจทย์เสริม: ปุ่มปิดการแสดงผล -->
                    <button id="hide-btn" class="btn btn-outline-secondary mt-3 w-100" style="display: none;">❌ ปิดการแสดงผล</button>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const checkBtn = document.getElementById("check-btn");
    const hideBtn = document.getElementById("hide-btn");
    const statusPanel = document.getElementById("status-panel");

    // 1. ดักจับการคลิกตรวจสอบ
    checkBtn.addEventListener("click", function() {
        statusPanel.style.display = "block";
        hideBtn.style.display = "block"; // แสดงปุ่มปิด
        checkBtn.className = "btn btn-success btn-lg w-100 disabled";
    });

    // 2. เฉลยโจทย์เสริม: ดักจับการคลิกเพื่อซ่อน
    hideBtn.addEventListener("click", function() {
        statusPanel.style.display = "none";
        hideBtn.style.display = "none";
        checkBtn.className = "btn btn-primary btn-lg w-100";
        checkBtn.innerText = "🔍 ตรวจสอบสถานะเครื่องจักร";
    });
</script>
</body>
</html>
