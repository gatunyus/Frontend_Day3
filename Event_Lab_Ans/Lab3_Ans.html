<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เฉลย Event Lab 3 (Bonus - สีเขียวเข้ม)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            transition: background-color 0.5s ease; 
            background-color: #f4f6f9; 
            font-size: 20px; 
        }
        .card { border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        /* สไตล์สีเขียวเข้มพิเศษเพื่อให้เห็นชัดเจน */
        .status-normal {
            background-color: #1a5928 !important;
            color: white !important;
            border: none;
            
        }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">✅ เฉลย Event Lab 3 (ฉบับสีเขียวเข้มชัดเจน)</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div id="main-card" class="card">
                <div class="card-header bg-success text-white fw-bold">3. ดักจับการเปลี่ยนค่า (Change)</div>
                <div class="card-body text-center">
                    <label class="form-label fw-bold d-block text-start">เลือกโหมดการทำงาน:</label>
                    <select id="mode-select" class="form-select form-select-lg mb-3">
                        <option value="">-- เลือกโหมด --</option>
                        <option value="slow">🐢 โหมดประหยัดพลังงาน (Slow)</option>
                        <option value="normal">🟢 โหมดปกติ (Normal)</option>
                        <option value="fast">🚀 โหมดเร่งด่วน (Fast)</option>
                    </select>
                    
                    <div id="mode-display" class="alert alert-secondary fs-4 mb-0">
                        สถานะปัจจุบัน: ยังไม่ได้เลือก
                    </div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const modeSelect = document.getElementById("mode-select");
    const modeDisplay = document.getElementById("mode-display");

    modeSelect.addEventListener("change", function() {
        let mode = modeSelect.value;
        
        if (mode === "slow") {
            modeDisplay.innerHTML = "🐢 <strong>กำลังทำงาน:</strong> โหมดประหยัดพลังงาน";
            modeDisplay.className = "alert alert-warning fs-4 mb-0";
            document.body.style.backgroundColor = "#fff9db"; 
        } 
        else if (mode === "normal") {
            modeDisplay.innerHTML = "🟢 <strong>กำลังทำงาน:</strong> โหมดปกติ";
            // ใช้คลาสสีเขียวเข้มที่เราสร้างขึ้นเอง
            modeDisplay.className = "alert status-normal fs-4 mb-0";
            document.body.style.backgroundColor = "#f4f6f9"; 
        } 
        else if (mode === "fast") {
            modeDisplay.innerHTML = "🚀 <strong>กำลังทำงาน:</strong> โหมดเร่งด่วน!";
            modeDisplay.className = "alert alert-danger fs-4 mb-0 fw-bold";
            document.body.style.backgroundColor = "#ffdcdc"; 
        } 
        else {
            modeDisplay.innerHTML = "สถานะปัจจุบัน: ยังไม่ได้เลือก";
            modeDisplay.className = "alert alert-secondary fs-4 mb-0";
            document.body.style.backgroundColor = "#f4f6f9"; 
        }
    });
</script>
</body>
</html>
