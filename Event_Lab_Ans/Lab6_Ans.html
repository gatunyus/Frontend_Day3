<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เฉลย Event Lab 6 (Bonus)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f4f6f9; font-size: 20px; }</style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">✅ เฉลย Event Lab 6 (พร้อมโจทย์เสริม)</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">6. การส่งฟอร์ม (Form Submit)</div>
                <div class="card-body">
                    <form id="report-form">
                        <div class="mb-3">
                            <label class="form-label">ชื่อผู้แจ้ง:</label>
                            <input type="text" id="reporter-name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">รายละเอียดปัญหา:</label>
                            <textarea id="report-desc" class="form-control" required></textarea>
                        </div>
                        <button type="submit" id="submit-btn" class="btn btn-danger w-100">ส่งรายงานความผิดปกติ</button>
                    </form>
                    <div id="result-alert" class="alert alert-success mt-4" style="display: none;"></div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const reportForm = document.getElementById("report-form");
    const submitBtn = document.getElementById("submit-btn");
    const resultAlert = document.getElementById("result-alert");

    reportForm.addEventListener("submit", function(e) {
        e.preventDefault();

        // เฉลยโจทย์เสริม: จำลอง Loading State
        const originalText = submitBtn.innerText;
        submitBtn.innerText = "⏳ กำลังส่งข้อมูล...";
        submitBtn.disabled = true;

        const name = document.getElementById("reporter-name").value;
        const desc = document.getElementById("report-desc").value;

        // หน่วงเวลา 1 วินาทีให้เหมือนมีการส่งข้อมูลจริง
        setTimeout(() => {
            submitBtn.innerText = originalText;
            submitBtn.disabled = false;

            resultAlert.style.display = "block";
            resultAlert.innerHTML = `<strong>ขอบคุณคุณ ${name}!</strong> ส่งรายงานแล้ว: ${desc}`;
            
            reportForm.reset();
        }, 1000);
    });
</script>
</body>
</html>
