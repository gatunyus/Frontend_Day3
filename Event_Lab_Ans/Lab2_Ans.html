<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เฉลย Event Lab 2 (Bonus)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f4f6f9; font-size: 20px; }</style>
</head>
<body>
<div class="container py-4">
    <h1 class="text-center mb-4">✅ เฉลย Event Lab 2 (พร้อมโจทย์เสริม)</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark font-weight-bold">2. ดักจับการพิมพ์ (Input)</div>
                <div class="card-body">
                    <label class="form-label fw-bold">กรอกรหัสพนักงาน (4-10 ตัว):</label>
                    <input type="text" id="emp-input" class="form-control form-control-lg" placeholder="เช่น EMP-01">
                    <div id="feedback" class="form-text mt-2" style="min-height: 24px;"></div>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
<script>
    const empInput = document.getElementById("emp-input");
    const feedback = document.getElementById("feedback");

    empInput.addEventListener("input", function() {
        let val = empInput.value;
        
        if (val.length === 0) {
            feedback.innerText = "";
            empInput.style.borderColor = "";
        } 
        else if (val.length < 6) {
            feedback.innerText = "❌ รหัสสั้นเกินไป (ต้องมี 6 ตัวขึ้นไป)";
            feedback.className = "form-text text-danger mt-2 fw-bold";
            empInput.style.borderColor = "red";
        } 
        // เฉลยโจทย์เสริม: เช็คความยาวสูงสุด 10 ตัว และตัดทิ้งถ้าเกิน
        else if (val.length > 10) {
            feedback.innerText = "❌ รหัสยาวเกินไป (สูงสุด 10 ตัว)";
            feedback.className = "form-text text-danger mt-2 fw-bold";
            empInput.style.borderColor = "red";
            
            // ทำการตัดข้อความที่เกินทิ้งทันที
            empInput.value = val.substring(0, 10);
        }
        else {
            feedback.innerText = "✅ รหัสถูกต้องพร้อมใช้งาน";
            feedback.className = "form-text text-success mt-2 fw-bold";
            empInput.style.borderColor = "green";
        }
    });
</script>
</body>
</html>
